<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="icons/icon-32.png" />
    <title>WEBtoPDF — Prévia</title>
  </head>
  <body>
    <header class="app-header">
      <img class="brand" src="brand/logo-horizontal-escuro-transparente.png" alt="WEBtoPDF" width="186" height="38" />
      <p class="privacy-badge"><span class="privacy-dot" aria-hidden="true"></span>Processamento local</p>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-labelledby="ajustes-title">
        <div class="sidebar-scroll">
          <h2 id="ajustes-title" class="sidebar-title">Ajustes de impressão</h2>

          <section class="card print-card" aria-labelledby="papel-title">
            <h3 id="papel-title" class="card-title">Papel</h3>
            <div class="paper-grid" role="radiogroup" aria-label="Papel" id="paper-size"></div>

            <div class="custom-paper" id="custom-paper-fields" hidden>
              <label class="field">
                <span>Largura (mm)</span>
                <input id="custom-width" type="number" min="20" max="2000" step="1" inputmode="numeric" />
              </label>
              <label class="field">
                <span>Altura (mm)</span>
                <input id="custom-height" type="number" min="20" max="2000" step="1" inputmode="numeric" />
              </label>
            </div>
            <p class="hint" id="paper-hint"></p>
          </section>

          <section class="card print-card" aria-labelledby="orientacao-title">
            <h3 id="orientacao-title" class="card-title">Orientação</h3>
            <div class="segmented" role="radiogroup" aria-label="Orientação">
              <button type="button" role="radio" aria-checked="true" data-orientation="portrait">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="segment-icon"><rect x="6" y="3" width="12" height="18" rx="1.5" /></svg>
                Retrato
              </button>
              <button type="button" role="radio" aria-checked="false" data-orientation="landscape">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="segment-icon"><rect x="3" y="6" width="18" height="12" rx="1.5" /></svg>
                Paisagem
              </button>
            </div>
          </section>

          <section class="card print-card" aria-labelledby="layout-title">
            <h3 id="layout-title" class="card-title">Layout</h3>

            <label class="field">
              <span class="field-head">
                Margens
                <span id="margin-output" class="field-value">10 mm</span>
              </span>
              <input id="margin" type="range" min="0" max="50" step="1" />
            </label>

            <label class="field">
              <span class="field-head">
                Escala
                <span id="scale-output" class="field-value">100%</span>
              </span>
              <input id="scale" type="range" min="10" max="200" step="5" />
            </label>

            <p class="hint hint-muted" id="full-page-hint" hidden>
              Em página inteira a folha acompanha o conteúdo: margens, escala e orientação ficam fixas.
            </p>
          </section>

          <section class="card print-card" aria-labelledby="conteudo-title">
            <h3 id="conteudo-title" class="card-title">Conteúdo</h3>
            <label class="switch">
              <input id="backgrounds" type="checkbox" />
              <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
              <span class="switch-text">
                Incluir fundos
                <small>Cores e imagens de fundo da página</small>
              </span>
            </label>
            <label class="switch">
              <input id="header-footer" type="checkbox" />
              <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
              <span class="switch-text">
                Cabeçalho e rodapé
                <small>Data, título e URL impressos na página</small>
              </span>
            </label>
          </section>

          <section class="card" aria-labelledby="arquivo-title">
            <h3 id="arquivo-title" class="card-title">Arquivo</h3>
            <label class="field">
              <span>Nome do arquivo</span>
              <input id="filename" type="text" value="pagina.pdf" spellcheck="false" />
            </label>
          </section>

          <section class="card" aria-labelledby="direto-title">
            <h3 id="direto-title" class="card-title">Conversão direta</h3>
            <label class="switch">
              <input id="direct-conversion" type="checkbox" />
              <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
              <span class="switch-text">
                Conversão direta em 1 clique
                <small>Ligado, o ícone abre o PDF sem passar pelo menu</small>
              </span>
            </label>
          </section>
        </div>

        <div class="sidebar-footer">
          <button id="update-preview" type="button" class="button button-primary button-block">
            Atualizar prévia
          </button>
          <p class="sidebar-note">A aba original precisa ficar aberta para gerar de novo.</p>
        </div>
      </aside>

      <section class="preview" aria-labelledby="preview-title">
        <div class="preview-toolbar">
          <div class="preview-heading">
            <h2 id="preview-title">Prévia do PDF</h2>
            <p id="status" role="status" aria-live="polite">Preparando conversão…</p>
          </div>
          <div class="download-actions">
            <button id="download-pdf" type="button" class="button button-primary" disabled>Baixar PDF</button>
            <button id="save-as-pdf" type="button" class="button button-ghost" disabled>Salvar como…</button>
          </div>
        </div>

        <div class="viewer-controls" hidden>
          <button id="previous-page" type="button" class="icon-button" aria-label="Página anterior" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <label class="page-field" for="page-number">
            <span>Página</span>
            <input id="page-number" type="number" min="1" value="1" aria-label="Página atual" />
            <span id="page-count" class="page-count"></span>
          </label>
          <button id="next-page" type="button" class="icon-button" aria-label="Próxima página" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
          </button>
          <span class="controls-separator" aria-hidden="true"></span>
          <label class="zoom-field" for="zoom">
            <span>Zoom</span>
            <select id="zoom">
              <option value="0.5">50%</option>
              <option value="0.75">75%</option>
              <option value="1" selected>100%</option>
              <option value="1.25">125%</option>
              <option value="1.5">150%</option>
              <option value="2">200%</option>
            </select>
          </label>
        </div>

        <div id="pdf-container" class="pdf-container" aria-label="Documento PDF"></div>
        <div id="image-container" class="image-container" aria-label="Imagem da página" hidden>
          <img id="preview-image" alt="Prévia da imagem da página" />
        </div>
        <div id="text-container" class="text-container" aria-label="Texto extraído da página" hidden>
          <pre id="preview-text" class="preview-text"></pre>
        </div>
      </section>
    </main>

    <script type="module" src="/src/preview/index.ts"></script>
  </body>
</html>
